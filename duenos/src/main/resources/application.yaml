server:
port: 8080

spring:
application:
name: duenos
datasource:
url: jdbc:mysql://localhost:3306/db_veterinaria_duenos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
username: root
password: ""
jpa:
hibernate:
ddl-auto: update
show-sql: true
properties:
hibernate:
dialect: org.hibernate.dialect.MySQLDialect
flyway:
enabled: false

servicios:
mascotas:
url: http://localhost:8082

eureka:
client:
fetch-registry: true
register-with-eureka: true
service-url:
defaultZone: http://localhost:8761/eureka/
instance:
prefer-ip-address: true