server:
  port: 8081

spring:
  application:
    name: inventario
  datasource:
    url: jdbc:mysql://localhost:3306/db_veterinaria_inventario?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false