spring:
  application:
    name: servicio-citas

  datasource:
    url: jdbc:mysql://localhost:3306/db_veterinaria_citas?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false

server:
  port: 8085

servicios:
  mascotas:
    url: http://localhost:8082
  duenos:
    url: http://localhost:8080
  veterinarios:
    url: http://localhost:8087

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html