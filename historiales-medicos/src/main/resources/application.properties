spring:
application:
name: servicio-historial-medico
server:
port: 8086

servicios:
mascotas:
url: http://localhost:8082

spring:
datasource:
url: jdbc:mysql://localhost:3306/db_veterinaria_historial?createDatabaseIfNotExist=true&serverTimezone=UTC
username: root
password:
driver-class-name: com.mysql.cj.jdbc.Driver

jpa:
hibernate:
ddl-auto: update
show-sql: true
properties:
hibernate:
dialect: org.hibernate.dialect.MySQLDialect

eureka:
client:
fetch-registry: false
register-with-eureka: false

spring:
flyway:
enabled: false

springdoc:
api-docs:
enabled: true
swagger-ui:
enabled: true