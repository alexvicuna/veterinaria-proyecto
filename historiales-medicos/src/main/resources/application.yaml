server:
port: 8086

spring:
application:
name: servicio-historial-medico
datasource:
url: jdbc:mysql://localhost:3306/db_veterinaria_historial?createDatabaseIfNotExist=true&serverTimezone=UTC
username: root
password: ""
driver-class-name: com.mysql.cj.jdbc.Driver
jpa:
hibernate:
ddl-auto: update
show-sql: true
properties:
hibernate:
dialect: org.hibernate.dialect.MySQLDialect
flyway:
enabled: false

servicios:
mascotas:
url: http://localhost:8082
veterinarios:
url: http://localhost:8087

eureka:
client:
fetch-registry: true
register-with-eureka: true
service-url:
defaultZone: http://localhost:8761/eureka/
instance:
prefer-ip-address: true

springdoc:
api-docs:
enabled: true
swagger-ui:
enabled: true